name: Stremio FileList
version: "1.12.1"
slug: stremio-filelist
description: Stream torrents from FileList.io through Stremio
url: https://github.com/vladutstoica/stremio-filelist
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
map:
  - share:rw
options:
  FILELIST_USER: ""
  FILELIST_PASSKEY: ""
  API_KEY: ""
  BASE_URL: ""
  CACHE_SIZE_MB: 500
  READ_AHEAD_PCT: 95
  DOWNLOAD_LIMIT_MBPS: 8
  MAX_CONNS: 20
schema:
  FILELIST_USER: str?
  FILELIST_PASSKEY: str?
  API_KEY: str?
  BASE_URL: str?
  CACHE_SIZE_MB: int(64,3000)?
  READ_AHEAD_PCT: int(50,99)?
  DOWNLOAD_LIMIT_MBPS: int(1,100)?
  MAX_CONNS: int(5,100)?
